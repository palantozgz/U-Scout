    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=6" />

    <!--
      Pantalla de carga estática (pre-React): cubre el hueco entre el primer
      paint del HTML y el montaje de React (parse de JS + initLocale()).
      Colores fijos = tokens del tema Game Night (index.css .dark), ya que
      en este punto no sabemos aún el tema guardado del usuario. Se elimina
      sola en App.tsx apenas React monta (ver useEffect "boot-loader").
    -->
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: hsl(228 18% 5%);
        transition: opacity 220ms ease;
      }
      #boot-loader.boot-loader-hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot-loader svg {
        width: 32px;
        height: 32px;
        animation: boot-loader-spin 0.8s linear infinite;
      }
      @keyframes boot-loader-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="hsl(228 18% 20%)" stroke-width="2.5"></circle>
        <path d="M12 2a10 10 0 0 1 10 10" stroke="hsl(38 92% 55%)" stroke-width="2.5" stroke-linecap="round"></path>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
