  <body>
    <!--
      Pantalla de carga estatica (pre-React): cubre el hueco entre el primer
      paint del HTML y el montaje de React (parse de JS + initLocale()).
      A proposito NO se usa un bloque de estilos separado ni keyframes de CSS
      en este archivo: eso activa una ruta del plugin HTML de Vite que
      intenta hashear ese bloque via crypto.hash(), funcion que no existe en
      Node 18 (el builder de Railway sigue en Node 18.20.5 aunque vite@7
      pide >=20.19) y el build falla en seco (crypto.hash is not a
      function). Por eso todo aqui usa solo el atributo style de cada
      elemento mas animacion SVG nativa (animateTransform). Colores fijos =
      tokens del tema Game Night (index.css .dark), ya que en este punto no
      sabemos aun el tema guardado del usuario. Se retira sola en App.tsx
      apenas React monta.
    -->
    <div
      id="boot-loader"
      aria-hidden="true"
      style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:hsl(228 18% 5%);transition:opacity 220ms ease;"
    >
      <svg viewBox="0 0 24 24" fill="none" style="width:32px;height:32px;">
        <circle cx="12" cy="12" r="10" stroke="hsl(228 18% 20%)" stroke-width="2.5"></circle>
        <path d="M12 2a10 10 0 0 1 10 10" stroke="hsl(38 92% 55%)" stroke-width="2.5" stroke-linecap="round">
          <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 12 12" to="360 12 12" dur="0.8s" repeatCount="indefinite" />
        </path>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
